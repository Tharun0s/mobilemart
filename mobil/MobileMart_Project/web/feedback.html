<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MobileMart Feedback</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header><a class="brand" href="/home.html">📱 MobileMart</a>
        <nav><a href="/home.html">Mobiles</a><a href="/cart.html">Cart</a><a href="/feedback.html">Feedback</a></nav>
    </header>
    <main class="login-card feedback-card">
        <h1>Customer Feedback</h1>
        <p>Tell us about your shopping experience.</p>
        <form id="feedbackForm"><label>Rating</label><select id="rating">
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Very good</option>
                <option value="3">3 - Good</option>
                <option value="2">2 - Fair</option>
                <option value="1">1 - Poor</option>
            </select><label>Comments</label><textarea id="comments" maxlength="500"
                placeholder="Write your feedback..."></textarea><button>Submit Feedback</button>
            <p id="message" class="message"></p>
        </form>
    </main>
    <script src="/js/app.js"></script>
</body>

</html>
